<text x="126" y="591" class="en">Uji Shrine → Ujigami Shrine</text>
<text x="126" y="626" class="note">两社间步行约 5 分钟，之后步行 15–20 分钟回表参道</text>
<path d="M70 697 V767" stroke="#56826b" stroke-width="3" stroke-dasharray="0"/>
<rect x="106" y="630" width="614" height="109" rx="18" fill="#fff" stroke="#dce3dd"/>
<circle cx="70" cy="668" r="19" fill="#56826b"/>
<text x="70" y="675" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">5</text>
<text x="126" y="660" class="time">11:30–12:15</text>
<text x="126" y="692" class="name">田中九商店 · 抹茶拉面候选</text>
<text x="126" y="717" class="en">Tanaka Kyushoten · matcha ramen candidate</text>
<text x="126" y="752" class="note">饭后步行约 10–15 分钟</text>
<path d="M70 823 V893" stroke="#56826b" stroke-width="3" stroke-dasharray="6 6"/>
