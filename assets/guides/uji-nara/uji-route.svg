<title id="title">宇治 · 上午步行路线</title><desc id="desc">UJI WALK · 先景点，再午餐和抹茶候选</desc>
<rect width="760" height="1137" rx="28" fill="#f6f7f3"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif;fill:#24332d}.title{font-size:31px;font-weight:700}.sub{font-size:17px;fill:#62746a}.name{font-size:25px;font-weight:650}.en{font-size:16px;fill:#62746a}.time{font-size:20px;font-weight:600}.note{font-size:18px;fill:#506459}.foot{font-size:17px;fill:#536b5c}</style>
<text x="40" y="58" class="title">宇治 · 上午步行路线</text>
<text x="40" y="92" class="sub">UJI WALK · 先景点，再午餐和抹茶候选</text>
<path d="M70 193 V263" stroke="#56826b" stroke-width="3" stroke-dasharray="0"/>
<rect x="106" y="126" width="614" height="109" rx="18" fill="#fff" stroke="#dce3dd"/>
<circle cx="70" cy="164" r="19" fill="#56826b"/>
<text x="70" y="171" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">1</text>
<text x="126" y="156" class="time">约 09:00</text>
<text x="126" y="188" class="name">JR 宇治站 · 南口</text>
<text x="126" y="213" class="en">JR Uji Station · south exit</text>
<text x="126" y="248" class="note">步行约 10–15 分钟</text>
<path d="M70 319 V389" stroke="#56826b" stroke-width="3" stroke-dasharray="0"/>
<rect x="106" y="252" width="614" height="109" rx="18" fill="#fff" stroke="#dce3dd"/>
<circle cx="70" cy="290" r="19" fill="#56826b"/>
<text x="70" y="297" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">2</text>
<text x="126" y="282" class="time">09:10–10:10</text>
<text x="126" y="314" class="name">平等院 · 庭园与博物馆</text>
<text x="126" y="339" class="en">Byodoin · garden &amp; museum</text>
<text x="126" y="374" class="note">庭园 08:45 开门，博物馆 09:00 开门</text>
<path d="M70 445 V515" stroke="#56826b" stroke-width="3" stroke-dasharray="0"/>
<rect x="106" y="378" width="614" height="109" rx="18" fill="#fff" stroke="#dce3dd"/>
<circle cx="70" cy="416" r="19" fill="#56826b"/>
<text x="70" y="423" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">3</text>
<text x="126" y="408" class="time">10:10–10:30</text>
<text x="126" y="440" class="name">宇治川 · 橘桥 / 朝雾桥</text>
<text x="126" y="465" class="en">Uji River · Tachibana / Asagiri bridges</text>
<text x="126" y="500" class="note">过桥到河东岸</text>
<path d="M70 571 V641" stroke="#56826b" stroke-width="3" stroke-dasharray="0"/>
<rect x="106" y="504" width="614" height="109" rx="18" fill="#fff" stroke="#dce3dd"/>
<circle cx="70" cy="542" r="19" fill="#56826b"/>
<text x="70" y="549" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">4</text>
<text x="126" y="534" class="time">10:30–11:10</text>
