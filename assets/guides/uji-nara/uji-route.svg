<text x="126" y="818" class="name">中村藤吉本店 · 甜点 / 伴手礼</text>
<text x="126" y="843" class="en">Optional: Nakamura Tokichi · sweets &amp; tea</text>
<text x="126" y="878" class="note">不提前排开门队；队长则买外带，再走 2–3 分钟到站</text>
<rect x="106" y="882" width="614" height="109" rx="18" fill="#fff" stroke="#dce3dd"/>
<circle cx="70" cy="920" r="19" fill="#56826b"/>
<text x="70" y="927" text-anchor="middle" style="fill:white;font-size:18px;font-weight:700">7</text>
<text x="126" y="912" class="time">约 13:00–13:10</text>
<text x="126" y="944" class="name">JR 宇治站 → JR 奈良站</text>
<text x="126" y="969" class="en">Miyakoji Rapid · towards Nara</text>
<text x="126" y="1004" class="note">车程约 30–40 分钟</text>
<text x="40" y="1100" class="foot">中村藤吉为候选；步行导航与开门时间在行程详情内。</text></svg>